[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agentic-ai-orchestrated-virtual-tumor-boards-for-ovarian-cancer"
version = "1.0.0"
description = "Structured multi-specialist deliberation for ovarian oncology"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "numpy==1.26.4",
  "scipy==1.12.0",
  "pandas==2.2.1",
  "scikit-learn==1.4.1.post1",
  "pydantic==2.6.4",
  "typer==0.12.3",
  "rich==13.7.1",
  "orjson==3.10.3",
  "pyyaml==6.0.1",
]

[project.scripts]
msdp-evaluate = "virtual_tumor_board.console:evaluate"
msdp-calibrate = "virtual_tumor_board.console:calibrate"
msdp-audit = "virtual_tumor_board.console:audit"

[tool.hatch.build.targets.wheel]
packages = ["code/virtual_tumor_board"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
packages = ["virtual_tumor_board"]
mypy_path = "code"
